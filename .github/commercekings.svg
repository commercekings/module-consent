<svg xmlns="http://www.w3.org/2000/svg" width="152" height="54" viewBox="0 0 152 54" role="img" aria-label="Built by CommerceKings. Ready to sell more? Talk to us">
  <title>Built by CommerceKings. Ready to sell more? Talk to us</title>
  <style>
    .q { fill: #59636e; }
    .l { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .q { fill: #9198a1; }
      .l { fill: #4493f8; }
    }
  </style>
  <linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
  <clipPath id="r"><rect width="152" height="20" rx="3"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="53" height="20" fill="#1f1f1f"/>
    <rect x="53" width="99" height="20" fill="#f26322"/>
    <rect width="152" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <g transform="scale(.1)">

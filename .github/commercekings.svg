      <text x="275" y="140" textLength="430">Built by</text>
      <text x="1015" y="150" fill="#010101" fill-opacity=".3" textLength="890" aria-hidden="true">CommerceKings</text>
      <text x="1015" y="140" textLength="890">CommerceKings</text>
    </g>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">
    <text x="6" y="36" class="q">Ready to sell more?</text>
    <text x="6" y="51" class="l">Talk to us</text>

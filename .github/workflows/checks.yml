name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-and-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Validate package manifest
        run: composer validate --strict --no-check-lock
      - name: Lint PHP and templates
        run: git ls-files -z -- '*.php' '*.phtml' | xargs -0 -r -n 1 php -d opcache.enable_cli=0 -l
      - name: Check Git distribution contents
        shell: bash
        run: |
          set -euo pipefail
          archive=$(mktemp)
          git archive --format=tar HEAD > "$archive"
          tar -tf "$archive" > "$archive.files"
          for required in composer.json registration.php README.md LICENSE COMPATIBILITY.md CHANGELOG.md; do
            grep -Fx "$required" "$archive.files"
          done
          if grep -E '^(Test/|\.github/|\.git/|vendor/|auth\.json$|\.admin_pw$)' "$archive.files"; then
            echo 'Development files or credentials found in distribution.' >&2
            exit 1
          fi

  tests:
    name: Unit and JavaScript tests (Magento 2.4.9, PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out this package
        uses: actions/checkout@v7
        with:
          # side by side under the repository names, as the JavaScript test harnesses expect
          path: packages/${{ github.event.repository.name }}
          persist-credentials: false
      - name: Check out the CommerceKings packages it can depend on
        shell: bash
        run: |
          set -euo pipefail
          self=$(jq -r .name "packages/${{ github.event.repository.name }}/composer.json")
          for repo in module-core module-consent module-consent-defaults module-consent-vanilla module-notification; do
            [ "commercekings/$repo" = "$self" ] && continue
            git clone --quiet --depth 1 "https://github.com/commercekings/$repo.git" "packages/$repo"
          done
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: bcmath, ctype, curl, dom, gd, hash, iconv, intl, mbstring, openssl, pdo_mysql, simplexml, soap, sockets, sodium, xsl, zip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-magento-2.4.9-${{ github.sha }}
          restore-keys: composer-magento-2.4.9-
      - name: Install Magento 2.4.9 with this package (Mage-OS mirror, no credentials, no database)
        shell: bash
        run: |
          set -euo pipefail
          composer create-project --no-install --no-interaction \
            --repository-url=https://mirror.mage-os.org/ magento/project-community-edition=2.4.9 magento
          cd magento
          composer config --unset repositories.0
          composer config repositories.mageos composer https://mirror.mage-os.org/
          composer config repositories.commercekings '{"type": "path", "url": "../packages/*", "options": {"symlink": true}}'
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins true
          self=$(jq -r .name "../packages/${{ github.event.repository.name }}/composer.json")
          extra=()
          # a feature that needs a consent banner gets the CommerceKings banner
          if jq -e '.require["commercekings/consent-source"]' "../packages/${{ github.event.repository.name }}/composer.json" >/dev/null; then
            extra+=("commercekings/module-consent-vanilla:@dev")
          fi
          composer require --no-update --no-interaction "$self:@dev" "${extra[@]}"
          composer install --no-interaction --no-progress
          echo "PACKAGE=$self" >> "$GITHUB_ENV"
      - name: Unit tests
        working-directory: magento
        run: vendor/bin/phpunit -c dev/tests/unit/phpunit.xml.dist --no-extensions --colors=never "vendor/$PACKAGE/Test/Unit"
      - name: JavaScript tests
        if: hashFiles(format('packages/{0}/Test/JavaScript/*.test.cjs', github.event.repository.name)) != ''
        working-directory: magento
        shell: bash
        run: MAGENTO_ROOT="$PWD" node --test vendor/$PACKAGE/Test/JavaScript/*.test.cjs
